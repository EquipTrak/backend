# PostgreSQL só para desenvolvimento: o Spring Boot (spring-boot-docker-compose) sobe este arquivo sozinho
# com `./gradlew bootRun`, por causa de spring.docker.compose.file no application.properties.
# Para rodar o sistema completo em contêineres (MySQL + backend + front), use o compose.yaml.
#
# Senha fixa de propósito: é um banco descartável, ligado só ao localhost e com porta aleatória.

services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1::5432'
