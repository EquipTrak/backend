spring.docker.compose.enabled=false
# Schema versionado: só o Flyway altera o banco; o Hibernate confere se as entidades batem com ele.
spring.flyway.enabled=true
# Banco criado antes das migrations (com ddl-auto=update) vira a versão 1 e recebe só as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/equiptrack?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
