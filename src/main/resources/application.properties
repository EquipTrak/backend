spring.application.name=backend

# Padrão (H2 dos testes e PostgreSQL de desenvolvimento): o Hibernate cria as tabelas e o Flyway fica desligado.
# O perfil mysql troca isso: o schema vem das migrations (db/migration) e o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.open-in-view=false

equiptrack.auth.token-validade=8h
equiptrack.auth.login.max-tentativas=5
equiptrack.auth.login.bloqueio=15m
# Fuso usado para decidir em que dia vence um empréstimo (RN15).
equiptrack.fuso-horario=${FUSO_HORARIO:America/Sao_Paulo}
equiptrack.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}

# Atrás de um proxy (o nginx do compose), o IP real do cliente vem no X-Forwarded-For. Só ligue isto se o backend
# NÃO estiver exposto direto: com a porta aberta, qualquer cliente poderia forjar o cabeçalho e escapar do
# bloqueio de tentativas de login. Valores: none (padrão), framework.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Swagger/OpenAPI descreve todas as rotas, inclusive as administrativas: fica desligado, salvo SWAGGER_ATIVO=true.
springdoc.api-docs.enabled=${SWAGGER_ATIVO:false}
springdoc.swagger-ui.enabled=${SWAGGER_ATIVO:false}

# Só o health é exposto, sem detalhes. É o que o Docker usa para saber se o backend está de pé e com banco.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Chave dos desenvolvedores para a gestão de usuários (/api/usuarios). Vazia, as rotas ficam fechadas.
equiptrack.desenvolvedor.chave=${EQUIPTRACK_CHAVE_DESENVOLVEDOR:}
